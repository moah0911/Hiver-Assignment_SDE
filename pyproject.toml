[project]
name = "hiver-agent"
version = "0.1.0"
description = "AI Support Agent for Twitter Customer Support — Hiver SDE Take-Home"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "langdetect>=1.0.9",
    "openai>=1.30",
    "datasets>=2.18",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "transformers>=4.40",
    "torch>=2.1",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]

[dependency-groups]
dev = [
    "kagglehub>=0.3",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
